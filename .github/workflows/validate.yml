# Validates .upptimerc.yml and the helper scripts before they can break monitoring.
#
# This file is SAFE to edit by hand, unlike the other workflows in this
# directory. The `update-template` job only deletes and regenerates the eight
# workflows Upptime owns (graphs, response-time, setup, site, summary,
# update-template, updates, uptime); anything else here is left alone.

name: Validate Config

on:
  pull_request:
    paths:
      - ".upptimerc.yml"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
  push:
    branches: [master]
    paths:
      - ".upptimerc.yml"
      - ".github/scripts/**"
      - "tests/**"
  workflow_dispatch:

# Least privilege: this job only reads the tree. The generated Upptime
# workflows need write access to commit history; this one does not.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. Tags are
      # mutable — an attacker who compromises the action repo can repoint v6 at
      # malicious code, and this job would silently pick it up.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes; leaving credentials in .git/config would
          # expose the token to anything else running in the container.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Validate .upptimerc.yml
        run: python .github/scripts/validate_config.py
