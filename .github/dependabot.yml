# Dependabot is deliberately scoped to `pip` ONLY.
#
# The `github-actions` ecosystem is intentionally absent. Dependabot cannot be
# restricted to individual workflow files, and eight of the nine workflows here
# are generated by Upptime's `update-template` job — it deletes and rewrites
# them on a schedule. Any action bump Dependabot opened against those would be
# reverted on the next run, producing a permanent stream of PRs that reapply
# and revert forever.
#
# The SHA pins in validate.yml and pipeline-health.yml are therefore reviewed by
# hand. See CONTRIBUTING.md for how to resolve a tag to a SHA.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
