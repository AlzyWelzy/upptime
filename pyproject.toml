# Tooling config for the repository's helper scripts and their tests.
# This project ships no Python package — Upptime itself is a GitHub Action.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests import the validator only after adjusting sys.path.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
