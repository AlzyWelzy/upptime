# Upptime configuration
# Docs: https://upptime.js.org/docs/configuration
#
# This file is the single source of truth. Everything in .github/workflows is
# GENERATED from this file by the `update-template` job — never edit those by
# hand, your changes are deleted and rewritten on the next run.

owner: AlzyWelzy # GitHub username / organization that owns this repository
repo: upptime # Name of this repository

# Sent as the User-Agent on GitHub API requests.
user-agent: AlzyWelzy

# ---------------------------------------------------------------------------
# Monitors
# ---------------------------------------------------------------------------
# `slug` pins the generated filenames under history/, api/ and graphs/. Set it
# explicitly: without it the slug is derived from `name`, so renaming a monitor
# silently orphans its recorded history and the old data gets pruned.
#
# `__dangerous__body_down_if_text_missing` guards against the "200 OK but the
# page is broken" failure mode — a healthy status code alone is not proof the
# site rendered. Each string below was verified present in the served HTML.
sites:
  - name: rajpoot.dev
    slug: rajpoot-dev
    url: https://rajpoot.dev
    # Apex 301-redirects to www; redirects are followed, so this also asserts
    # the redirect target is healthy.
    maxResponseTime: 2000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10 # seconds
    requestTimeout: 30 # seconds

  - name: www.rajpoot.dev
    slug: www-rajpoot-dev
    url: https://www.rajpoot.dev
    maxResponseTime: 2000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: blog.rajpoot.dev
    slug: blog-rajpoot-dev
    url: https://blog.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: scorefit.net
    slug: scorefit-net
    url: https://scorefit.net
    # Apex 308-redirects to www.scorefit.net.
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "ScoreFit"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  # Vanity domains. Each 30x-redirects to the canonical site; redirects are
  # followed, so these assert the whole chain — DNS, certificate, redirect, and
  # the destination rendering — not merely that the domain resolves.
  - name: rajpoot.me
    slug: rajpoot-me
    url: https://rajpoot.me # -> www.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: alzywelzy.com
    slug: alzywelzy-com
    url: https://alzywelzy.com # -> www.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: www.alzywelzy.com
    slug: www-alzywelzy-com
    url: https://www.alzywelzy.com # -> www.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: welzyalzy.com
    slug: welzyalzy-com
    url: https://welzyalzy.com # -> www.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: www.welzyalzy.com
    slug: www-welzyalzy-com
    url: https://www.welzyalzy.com # -> www.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: rajpoot.blog
    slug: rajpoot-blog
    url: https://rajpoot.blog # -> blog.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  - name: www.rajpoot.blog
    slug: www-rajpoot-blog
    url: https://www.rajpoot.blog # -> blog.rajpoot.dev
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Manvendra Rajpoot"
    maxRedirects: 3
    connectTimeout: 10
    requestTimeout: 30

  # Not launched. Serves a Spaceship parking page over http, and https accepts
  # the TLS handshake but never returns a response — verified hanging for 30s
  # over both IPv4 and IPv6. This monitor is therefore RED until that is fixed,
  # which is correct: https is what visitors will use. Timeouts are kept short
  # so three retries do not add 90s to every run.
  - name: pacestreak.com
    slug: pacestreak-com
    url: https://pacestreak.com
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200
    maxRedirects: 3
    connectTimeout: 5
    requestTimeout: 10

  # rajpoot.xyz is registered but deliberately NOT monitored. Its nameservers
  # are Spaceship's defaults with no A/AAAA record at all, so every check would
  # be NXDOMAIN forever — a permanently failing monitor that teaches you to
  # ignore the status page. Add an entry here once it points somewhere.

  # -------------------------------------------------------------------------
  # TLS certificate expiry
  # -------------------------------------------------------------------------
  # `check: ssl` connects to the host and reads the certificate's notAfter date.
  # It reports DOWN when the certificate expires in less than 7 days, and UP
  # otherwise — there is no intermediate "expiring soon" state.
  #
  # NOTE: for ssl checks `url` must be a BARE HOSTNAME, not a URL. The value is
  # passed straight to https.request as `host`; a "https://" prefix fails.
  #
  # Expiry is otherwise silent and total: an HTTP check keeps passing right up
  # until the cert lapses, then every visitor gets a browser interstitial.
  - name: rajpoot.dev TLS certificate
    slug: rajpoot-dev-tls
    url: rajpoot.dev
    check: ssl

  - name: www.rajpoot.dev TLS certificate
    slug: www-rajpoot-dev-tls
    url: www.rajpoot.dev
    check: ssl

  - name: blog.rajpoot.dev TLS certificate
    slug: blog-rajpoot-dev-tls
    url: blog.rajpoot.dev
    check: ssl

  - name: scorefit.net TLS certificate
    slug: scorefit-net-tls
    url: scorefit.net
    check: ssl

  - name: rajpoot.me TLS certificate
    slug: rajpoot-me-tls
    url: rajpoot.me
    check: ssl

  # A vanity domain's certificate expiring breaks the redirect with a browser
  # interstitial just as thoroughly as it would on the canonical site.
  #
  # Only the apex is monitored for alzywelzy.com and welzyalzy.com: apex and www
  # are covered by the same certificate (identical notAfter), so a second check
  # would add noise without adding coverage. rajpoot.blog is the exception —
  # apex and www genuinely have separate certificates with different expiry
  # dates, so both are monitored.
  - name: alzywelzy.com TLS certificate
    slug: alzywelzy-com-tls
    url: alzywelzy.com
    check: ssl

  - name: welzyalzy.com TLS certificate
    slug: welzyalzy-com-tls
    url: welzyalzy.com
    check: ssl

  # WARNING (verified 2026-08-01): rajpoot.blog and www.rajpoot.blog serve TWO
  # different certificates from the same anycast IP (15.197.162.184), chosen
  # non-deterministically per connection — roughly 65% expire 2026-08-15 and
  # 35% expire 2026-10-14. Renewal has reached some backends but not all.
  #
  # Consequence: after 2026-08-15 most visitors get an expired-certificate
  # interstitial while a minority see a healthy site, and this check will FLAP
  # rather than fail cleanly, because it samples one backend per run.
  # A single ssl check cannot express "some backends are stale" — treat a flap
  # here as a real problem, not a false positive.
  - name: rajpoot.blog TLS certificate
    slug: rajpoot-blog-tls
    url: rajpoot.blog
    check: ssl

  - name: www.rajpoot.blog TLS certificate
    slug: www-rajpoot-blog-tls
    url: www.rajpoot.blog
    check: ssl

  # pacestreak.com's certificate is valid (Google Trust Services, Oct 2026)
  # even though the origin never answers over https — so this check is
  # meaningful and currently passes.
  - name: pacestreak.com TLS certificate
    slug: pacestreak-com-tls
    url: pacestreak.com
    check: ssl

# ---------------------------------------------------------------------------
# Secrets allowlist
# ---------------------------------------------------------------------------
# When this key is present it is EXHAUSTIVE — only these secrets are injected
# into the workflow's SECRETS_CONTEXT. Keeping it explicit is least-privilege:
# without it, Upptime emits references for every notification provider it
# supports (~90 entries), most of which will never be set.
#
# Add the matching repository secrets under
# Settings -> Secrets and variables -> Actions.
secrets:
  # Telegram — NOTIFICATION_TELEGRAM must be set (any truthy value) to enable.
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID # comma-separated for multiple chats
  # Email over SMTP — NOTIFICATION_EMAIL_SMTP must be set to enable.
  - NOTIFICATION_EMAIL_SMTP
  - NOTIFICATION_EMAIL_SMTP_HOST
  - NOTIFICATION_EMAIL_SMTP_PORT
  - NOTIFICATION_EMAIL_SMTP_USERNAME
  - NOTIFICATION_EMAIL_SMTP_PASSWORD
  - NOTIFICATION_EMAIL_FROM
  - NOTIFICATION_EMAIL_TO
  # Optional message overrides
  - NOTIFICATIONS_DOWN_MESSAGE
  - NOTIFICATIONS_UP_MESSAGE

# ---------------------------------------------------------------------------
# Incidents
# ---------------------------------------------------------------------------
# Downtime opens a GitHub issue; recovery closes it. This repo is the incident log.
assignees:
  - AlzyWelzy

# Keep issues for outages that resolve in under 15 minutes instead of deleting
# them. Flapping is a real signal and should stay in the audit trail.
skipDeleteIssues: true

# ---------------------------------------------------------------------------
# Status page
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# History graph colours
# ---------------------------------------------------------------------------
# Read by the status page's Graph.svelte for the interactive response-time
# chart on each monitor's History page (defaults: #89e0cf / #1abc9c teal).
# These are the site's green, so the chart matches the rest of the page.
#
# They do NOT affect the sparkline PNGs in the status list — those colours are
# hardcoded in the upptime/graphs action.
graphBackgroundColor: "#05df7233"
graphBorderColor: "#05df72"

status-website:
  cname: status.rajpoot.dev
  name: Rajpoot Status
  theme: dark
  logoUrl: https://www.rajpoot.dev/icon.svg
  faviconSvg: https://www.rajpoot.dev/icon.svg
  favicon: https://www.rajpoot.dev/favicon.ico
  introTitle: "**Rajpoot** service status"
  introMessage: Live availability and response times for rajpoot.dev and related services. Every endpoint is checked from GitHub Actions every 5 minutes; incidents are tracked as [GitHub issues](https://github.com/$OWNER/$REPO/issues).
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://rajpoot.dev
    - title: Incidents
      href: https://github.com/$OWNER/$REPO/issues
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  metaTags:
    - name: description
      content: Live uptime and response-time status for rajpoot.dev, blog.rajpoot.dev, scorefit.net and related domains.
    - name: og:title
      content: Rajpoot Status
    - name: og:description
      content: Live uptime and response-time status for rajpoot.dev and related services.
    - name: og:url
      content: https://status.rajpoot.dev
    - name: og:type
      content: website
    - name: twitter:card
      content: summary
  robotsText: |
    User-agent: *
    Allow: /
    Sitemap: https://status.rajpoot.dev/sitemap.xml

  # -------------------------------------------------------------------------
  # Theme
  # -------------------------------------------------------------------------
  # `theme: dark` above loads themes/dark.css; this block is injected as an
  # inline <style> AFTER that stylesheet, so these :root values win. Everything
  # here is a variable the status page actually reads (the full set is in
  # upptime/status-page static/themes/dark.css) — a variable it does not define
  # is silently ignored, so do not invent names.
  #
  # dark.css is teal (#1abc9c on near-black). These values retune it to the
  # palette rajpoot.dev itself uses — navy ground, indigo chrome, green accent —
  # so the status page reads as part of the site rather than a bolted-on
  # third-party page.
  css: |
    /* ---------------------------------------------------------------- */
    /* Palette                                                          */
    /* ---------------------------------------------------------------- */
    :root {
      /* Ground and text — the site's navy, not dark.css's near-black teal. */
      --body-background-color: #0b1020;
      --body-text-color: #e5e7eb;
      --card-background-color: #0f172b;
      --card-border-color: #1e2939;

      /* Navigation. The active tab is underlined in the site's green accent. */
      --nav-background-color: #0f172b;
      --nav-border-bottom-color: #1e2939;
      --nav-current-border-bottom-color: #05df72;

      /* Status accents. These carry the actual meaning of the page, so they
         stay high-contrast against the navy card and keep the conventional
         green/amber/red mapping — brand fit never outranks legibility here. */
      --up-border-left-color: #05df72;
      --degraded-border-left-color: #f7b731;
      --down-border-left-color: #e40014;
      --down-background-color: #2a0810;

      /* Status pills. Dark text on a bright fill, for AA contrast. */
      --tag-color: #0b1020;
      --tag-up-background-color: #05df72;
      --tag-degraded-background-color: #f7b731;
      --tag-down-background-color: #ff6568;
      --change-background-color: #f7b731;

      /* Buttons pick up the site's deep indigo. */
      --submit-button-background-color: #312e81;
      --submit-button-border-color: #241659;
      --submit-button-color: #ffffff;
      --error-button-background-color: #312e81;
      --error-button-border-color: #241659;
      --error-button-color: #ffffff;

      /* NOTE: these two are inert on the status list. global.css applies them
         via `article .graph` (a descendant), but LiveStatus puts `.graph` on
         the article ITSELF, so the rule never matches. They are left at the
         no-op values for the History page, which does nest a `.graph`; the
         list sparklines are toned down with a scrim further down instead. */
      --graph-opacity: 1;
      --graph-filter: none;
    }

    /* ---------------------------------------------------------------- */
    /* Typography                                                       */
    /* ---------------------------------------------------------------- */
    /* global.css asks for Roboto but never loads it, so this always fell
       through to whatever the OS offered. A status page is the last thing
       that should block on a font CDN, so this is a system stack: no
       request, no FOUT, no third party in the render path. */
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header h1 {
      font-size: 2.25rem;
      letter-spacing: -0.022em;
    }

    header p.lead {
      color: #90a1b9;
      max-width: 62ch;
    }

    /* ---------------------------------------------------------------- */
    /* Monitor cards                                                    */
    /* ---------------------------------------------------------------- */
    /* Component styles are Svelte-scoped, so they carry an extra class.
       These selectors match that specificity and win on source order —
       this block is injected after them. */
    section.live-status article.link {
      border-radius: 0.6rem;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    section.live-status article.link:hover {
      border-color: #3b4a63;
      transform: translateY(-1px);
    }

    section.live-status article + article {
      margin-top: 0.6rem;
    }

    /* The response-time PNGs are generated in a fixed bright mint (#89e0cf,
       hardcoded in upptime/graphs — not configurable), so at full strength
       each card wears a hard-edged blob louder than the status it decorates.
       Layering a card-coloured scrim OVER the image dims the image alone;
       putting opacity on the article would fade the text with it. Layer one
       is the scrim, layer two the sparkline — inset from the edge and short
       of full height so it reads behind the text, not beside it. */
    article.graph.link {
      background-image: linear-gradient(
          rgba(15, 23, 43, 0.72),
          rgba(15, 23, 43, 0.72)
        ),
        var(--background);
      background-size: cover, auto 74%;
      background-position: center, right 0.85rem center;
      background-repeat: no-repeat, no-repeat;
    }

    /* The uptime and latency figures are the reason anyone opens this page,
       so the labels recede and the numbers carry the contrast. Tabular
       figures keep the columns from jittering as values change. */
    section.live-status article > div {
      color: #90a1b9;
      font-size: 0.94rem;
    }

    article.graph .data {
      color: #e5e7eb;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    section.live-status article h4 {
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }

    /* On a narrow screen the card is too tight for both: the sparkline runs
       under the latency figure. Decoration loses to the number. */
    @media (max-width: 560px) {
      article.graph.link {
        background-image: none;
      }
    }

    /* ---------------------------------------------------------------- */
    /* TLS certificate cards                                            */
    /* ---------------------------------------------------------------- */
    /* A `check: ssl` monitor has no HTTP origin, so uptime-monitor writes
       icon "https://icons.duckduckgo.com/ip3/null.ico" — DuckDuckGo answers
       that with a generic placeholder glyph — and responseTime 0. The card
       therefore shows a meaningless icon and an authoritative-looking
       "0 ms" that is not a measurement of anything.
       
       There is no class distinguishing these cards, but the null icon is an
       exact, stable marker of one, so it does the selecting. Nothing here is
       load-bearing: if :has() is unavailable the rule is dropped and the row
       simply reappears. */
    article img.icon[src*="null.ico"] {
      display: none;
    }

    /* The second row is average response time; the first is uptime, which is
       real for a certificate check and stays. `div + div` only matches when
       there are two, so a card with just uptime is left alone. */
    article:has(img.icon[src*="null.ico"]) > div + div {
      display: none;
    }

# ---------------------------------------------------------------------------
# Commit messages
# ---------------------------------------------------------------------------
# [skip ci] on the bookkeeping commits stops them retriggering other workflows.
commitMessages:
  readmeContent: ":pencil: Update summary in README [skip ci] [upptime]"
  summaryJson: ":card_file_box: Update status summary [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: ":bento: Update graphs [skip ci] [upptime]"
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "73812536+upptime-bot@users.noreply.github.com"

# ---------------------------------------------------------------------------
# Schedules (cron, UTC)
# ---------------------------------------------------------------------------
workflowSchedule:
  uptime: "*/5 * * * *" # Check every 5 minutes
  responseTime: "0 23 * * *" # Record response times daily
  graphs: "0 0 * * *" # Regenerate graphs daily
  staticSite: "0 1 * * *" # Rebuild + deploy the status page daily
  summary: "0 0 * * *" # Refresh README summary daily
  updates: "0 3 * * *" # Check for Upptime updates daily
  updateTemplate: "0 0 * * 0" # Apply template updates weekly
